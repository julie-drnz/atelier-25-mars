<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edunet – Emploi du temps</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Syne:wght@700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo">
        <div class="logo-icon" aria-hidden="true">
          <img src="image.png" alt="Edunet logo" width="42" height="42" />
        </div>
        <span>Edunet</span>
      </div>
    </div>
  </header>

  <div class="card">
    <div class="timetable">
      <div class="timetable-header">
        <div class="day-header">Lundi</div>
        <div class="day-header">Mardi</div>
        <div class="day-header">Mercredi</div>
        <div class="day-header">Jeudi</div>
        <div class="day-header">Vendredi</div>
      </div>
      <div>
        <div
          style="height:200px; border:2px dashed #d0d8f0; border-radius:15px; display:flex; justify-content:center; align-items:center; color:#8892b8; margin-top:5px;">
          Aucun cours cette semaine</div>
      </div>

      <div class="week-label">Semaine du ... au ...</div>
    </div>
  </div>

  <footer>© 2025 Edunet – Tous droits réservés</footer>

</body>

</html>
