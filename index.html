<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edunet</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <header class="topbar">
        <div class="topbar-inner">
            <div class="logo">
                <div class="logo-icon" aria-hidden="true">
                    <img src="image.png" alt="Edunet logo" width="42" height="42" />
                </div>
                <span>Edunet</span>
            </div>
        </div>
    </header>

    <main class="main-grid">
        <article class="card">
            <img src="edtact.png" alt="edt" width="200">
            <h2>Emploi du temps</h2>
            <p>Consultez votre planning</p>
        </article>

        <article class="card">
            <img src="noteact.png" alt="notes" width="200">
            <h2>Relevé de notes</h2>
            <p>Accédez à vos résultats</p>
        </article>

        <article class="card">
            <img src="foract.png" alt="forum" width="200">
            <h2>Forum d'aide</h2>
            <p>Posez vos questions</p>
        </article>

        <article class="card">
            <img src="actact.png" alt="actualites" width="200">
            <h2>Actualités</h2>
            <p>Restez informé</p>
        </article>
    </main>

    <footer class="footer">
        <p>&copy; 2024 Edunet. Tous droits réservés.</p>

    </footer>
</body>

</html>
